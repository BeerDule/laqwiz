<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0b1f" />
    <meta name="description" content="Quizz Canapé — le quiz familial multijoueur sur un même écran." />
    <title>Canap' QuiZZ</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <!-- Calques de scène. Hors de #app, que les écrans remplacent par
         innerHTML : ils survivent donc à tout changement d'écran sans une
         ligne de JS. Neutres tant qu'un thème ne pose pas --stage-*. -->
    <div id="stage-backdrop" aria-hidden="true"></div>
    <div id="stage-vignette" aria-hidden="true"></div>
    <main id="app" aria-live="polite"></main>
    <div id="toast-region" role="status" aria-live="polite"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
